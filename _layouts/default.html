<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body>

  {% if site.data.settings.google_analytics %}
    {% include google-analytics.html %}
  {% endif %}

  <!-- begin global wrap -->
  <div class="global-wrap">
    {% include header.html %}

    <!-- begin content -->
    <main class="content" aria-label="Content">
      {{ content }}
    </main>
    <!-- end content -->

    {% include footer.html %}
  </div>
  <!-- end global wrap -->

  <div class="top" title="Top"><i class="fa-solid fa-arrow-up"></i></div>

  <div class="images-overlay"></div>

  <script src="{{ '/js/scripts.js' | relative_url }}"></script>
  <script src="{{ '/js/common.js' | relative_url }}"></script>
  <script>
    // Zap button guard. nostr-zap waits on the visitor's browser extension (window.nostr to sign,
    // window.webln to pay) with no timeout, so an extension that never answers leaves the dialog
    // stuck on "Loading". Time those calls out: signing falls back to an anonymous zap, and
    // payment falls back to the invoice QR code (the same invoice, so it can't be paid twice).
    (function () {
      function withTimeout(promise, ms, label) {
        return Promise.race([promise, new Promise(function (_, reject) {
          setTimeout(function () { reject(new Error(label + " timed out")); }, ms);
        })]);
      }
      document.addEventListener("click", function (e) {
        if (!e.target.closest || !e.target.closest(".nostr-zap-button")) return;
        var nostr = window.nostr, webln = window.webln;
        if (nostr && !nostr.__hnGuard && typeof nostr.signEvent === "function") {
          var sign = nostr.signEvent.bind(nostr);
          nostr.signEvent = function (ev) { return withTimeout(sign(ev), 5000, "signEvent"); };
          nostr.__hnGuard = true;
        }
        if (webln && !webln.__hnGuard && typeof webln.enable === "function" && typeof webln.sendPayment === "function") {
          var enable = webln.enable.bind(webln), pay = webln.sendPayment.bind(webln);
          webln.enable = function () { return withTimeout(enable(), 3000, "webln.enable"); };
          webln.sendPayment = function (invoice) { return withTimeout(pay(invoice), 60000, "webln.sendPayment"); };
          webln.__hnGuard = true;
        }
      }, true);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/nostr-zap@1.3.2"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var postLinks = document.querySelectorAll(".post__content a");
      postLinks.forEach(function(link) {
        if (link.hostname && link.hostname !== window.location.hostname) {
          link.setAttribute("target", "_blank");
          link.setAttribute("rel", "noopener noreferrer");
        }
      });
    });
  </script>

</body>

</html>
